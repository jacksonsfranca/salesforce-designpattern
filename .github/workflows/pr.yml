name: Validate to Production
on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - force-app/**
    branches:
      - main
jobs:
  validate-to-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: "14"
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Install Salesforce CLI
        run: >
          wget
          https://developer.salesforce.com/media/salesforce-cli/sf/channels/stable/sf-linux-x64.tar.xz

          mkdir ~/sfdx

          tar xJf sf-linux-x64.tar.xz -C ~/sfdx --strip-components 1

          echo "$HOME/sfdx/bin" >> $GITHUB_PATH

          ~/sfdx/bin/sfdx version
      - name: Populate auth file with SFDX_URL secret of target org
        run: |
          echo ${{ secrets.SECRET_DEPLOY}} > ./SECRET_DEPLOY.txt
      - name: Authenticate to target Org
        run: sfdx auth:sfdxurl:store -f ./SECRET_DEPLOY.txt -s -a targetOrg
      - name: Deployment - run all tests
        run: >
          sf project deploy validate --source-dir force-app --test-level RunAllTestsInOrg